---
strategy: polling
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.1.0
serverless_language: node
polling_url: "https://trmnl.bettens.dev/mtg-cards/card?color={{ color | join: ',' | url_encode }}&card_type={{ card_type | join: ',' | url_encode }}&rarity={{ rarity | join: ',' | url_encode }}&set_code={{ set_code | url_encode }}&language={{ language | url_encode }}"
polling_headers: ''
polling_body: ''
id: 297606
custom_fields:
- keyname: author_info
  name: About This Plugin
  field_type: author_bio
  description: 'Discover Magic: The Gathering cards on your TRMNL — browse sets, hunt for rares, or enjoy the artwork. Filter by color, type, rarity, or set. A new selection appears each refresh.<br/><br/><strong>Data:</strong> <a href="https://scryfall.com" target="_blank">Scryfall</a>.'
  github_url: https://github.com/ExcuseMi/trmnl-mtg-cards-plugin
  category: games,art
- keyname: language
  field_type: select
  name: Language
  description: Card language served by Scryfall.
  options:
  - English: en
  - German: de
  - French: fr
  - Spanish: es
  - Italian: it
  - Portuguese: pt
  - Japanese: ja
  - Korean: ko
  - Russian: ru
  - Chinese (Simplified): zhs
  - Chinese (Traditional): zht
  default: en
  optional: true
- keyname: color
  field_type: select
  multiple: true
  name: Color
  description: Show only cards of one or more colors. Leave empty for all colors.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  options:
  - White: W
  - Blue: U
  - Black: B
  - Red: R
  - Green: G
  - Multicolor: m
  - Colorless: c
  optional: true
- keyname: card_type
  field_type: select
  multiple: true
  name: Card Type
  description: Show only cards of one or more types. Leave empty for all types.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  options:
  - Creature: creature
  - Instant: instant
  - Sorcery: sorcery
  - Enchantment: enchantment
  - Artifact: artifact
  - Planeswalker: planeswalker
  - Land: land
  - Battle: battle
  optional: true
- keyname: rarity
  field_type: select
  multiple: true
  name: Rarity
  description: Show only cards of one or more rarities. Leave empty for all rarities. Great for browsing valuable or illustration cards.
  help_text: Use <kbd>⌘</kbd>+<kbd>click</kbd> or <kbd>ctrl</kbd>+<kbd>click</kbd> to select and deselect multiple options.
  options:
  - Common: common
  - Uncommon: uncommon
  - Rare: rare
  - Mythic: mythic
  optional: true
- keyname: set_code
  field_type: xhrSelectSearch
  name: Set
  description: Filter to a specific set.
  help_text: Choose <strong>Most Recent ★</strong> to always show the latest released set.
  endpoint: https://trmnl.bettens.dev/mtg-cards/sets
  http_verb: post
  exclude_csrf_token: true
  optional: true
name: Magic The Gathering Cards
refresh_interval: 15
